version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    # packages.lock.json makes this repo lock-file-driven (R0.3); a
    # Dependabot PR here must update the lock file too, not just
    # Directory.Packages.props, or the R0.3 offline-restore proof
    # breaks. Confirm Dependabot's NuGet lock-file support covers this
    # before merging its first PR rather than assuming it.
